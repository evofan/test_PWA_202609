<!Doctype html>

<html>

  <head>
    <meta charset="utf-8" />
    <title>test_calculator_202604</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="manifest.json" />
    <link rel="stylesheet" type="text/css" href="css/main.css" />
  </head>

  <body>

    <div id="container">

      <p class="summary">アプリver. 20260520 0100</p>

      <form name="calculator">

        <table>

          <!---結果メッセージ表示画面--->
          <tr>
            <td colspan="4">
              <input
                type="text"
                class="display_message"
                name="display_message"
                value=""
                disabled
              />
            </td>
          </tr>

          <!---数字計算表示画面--->
          <tr>
            <td colspan="4">
              <input
                type="text"
                class="display"
                name="display"
                value=""
                disabled
              />
            </td>
          </tr>

          <!---上から1段目（7〜9, ÷)--->
          <tr>
            <td><input type="button" value="7" onclick="get_calc(this)" /></td>
            <td><input type="button" value="8" onclick="get_calc(this)" /></td>
            <td><input type="button" value="9" onclick="get_calc(this)" /></td>
            <td>
              <input
                type="button"
                value="÷"
                class="operator"
                name="div_btn"
                onclick="get_calc(this)"
              />
            </td>
          </tr>

          <!---上から2段目(4〜6, ×)--->
          <tr>
            <td><input type="button" value="4" onclick="get_calc(this)" /></td>
            <td><input type="button" value="5" onclick="get_calc(this)" /></td>
            <td><input type="button" value="6" onclick="get_calc(this)" /></td>
            <td>
              <input
                type="button"
                value="×"
                class="operator"
                name="multi_btn"
                onclick="get_calc(this)"
              />
            </td>
          </tr>

          <!---上から3段目(1〜3, -)--->
          <tr>
            <td><input type="button" value="1" onclick="get_calc(this)" /></td>
            <td><input type="button" value="2" onclick="get_calc(this)" /></td>
            <td><input type="button" value="3" onclick="get_calc(this)" /></td>
            <td>
              <input
                type="button"
                value="-"
                class="operator"
                onclick="get_calc(this)"
              />
            </td>
          </tr>

          <!---上から4段目(0, C, =, +)--->
          <tr>
            <td><input type="button" value="0" onclick="get_calc(this)" /></td>
            <td>
              <input
                type="button"
                value="C"
                onclick="get_calc(this)"
                class="clear"
              />
            </td>
            <td>
              <input
                type="button"
                value="="
                class="equal"
                onclick="get_calc(this)"
              />
            </td>
            <td>
              <input
                type="button"
                value="+"
                class="operator"
                onclick="get_calc(this)"
              />
            </td>
          </tr>

          <!---上か5段目(No.登録, チェック)--->
          <tr>
            <td colspan="2">
              <input
                type="button"
                value="No.登録"
                onclick="setData()"
                class="set_data"
              />
            </td>
            <td colspan="2">
              <input
                type="button"
                value="チェック"
                onclick="checkData()"
                class="get_data"
              />
            </td>
          </tr>

          <!---上か6段目(No.削除, 登録一覧)--->
          <tr>
            <td colspan="2">
              <input
                type="button"
                value="No.削除"
                onclick="deleteData()"
                class="delete_data"
              />
            </td>
            <td colspan="2">
              <input
                type="button"
                value="登録一覧"
                onclick="displayRegistrationList()"
                class="displayRegistrationList"
              />
            </td>
          </tr>

          <!---上か6段目(ソート, 全削除)--->
          <tr>
            <td colspan="2">
              <input
                type="button"
                value="ソート"
                onclick="sortData()"
                class="delete_data"
              />
            </td>
            <td colspan="2">
              <input
                type="button"
                value="全削除"
                onclick="deleteAllData()"
                class="delete_data"
              />
            </td>
          </tr>

        </table>
        
      </form>
    </div>


    <script>
      // ServiceWorker登録：https://developers.google.com/web/fundamentals/primers/service-workers/?hl=ja
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker
          .register("sw.js")
          .then(function (registration) {
            console.log(
              "ServiceWorker registration successful with scope: ",
              registration.scope,
            );
          })
          .catch(function (err) {
            console.log("ServiceWorker registration failed: ", err);
          });
      }
    </script>
    <script src="js/howler.min.js"></script>
    <script src="js/expressionEvaluation.js"></script>
    <script src="js/main.js"></script>

  </body>

</html>
